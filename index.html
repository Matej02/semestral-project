<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #222;
      --border: #2e2e2e;
      --text: #f0ede8;
      --muted: #666;
      --accent: #c8f060;
      --accent-dark: #a8d040;
      --danger: #ff4d4d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(15,15,15,0.92); backdrop-filter: blur(12px); z-index: 10; }
    .nav-logo { font-family: 'DM Serif Display', serif; font-size: 1.3rem; letter-spacing: -0.02em; color: var(--text); text-decoration: none; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.85rem; font-weight: 400; letter-spacing: 0.04em; text-transform: uppercase; margin-left: 32px; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.active { color: var(--accent); }
    main { max-width: 860px; margin: 0 auto; padding: 60px 40px; }
    .page-header { margin-bottom: 56px; display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 24px; }
    .page-header h1 { font-family: 'DM Serif Display', serif; font-size: clamp(2.4rem, 5vw, 3.5rem); font-weight: 400; letter-spacing: -0.03em; line-height: 1; }
    .page-header h1 em { font-style: italic; color: var(--accent); }
    #taskCount { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; padding-bottom: 4px; }
    .add-form { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; margin-bottom: 48px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
    .form-fields { display: flex; flex-direction: column; gap: 10px; }
    input[type="text"], textarea { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 13px 16px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 300; width: 100%; transition: border-color 0.2s; outline: none; resize: none; }
    input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    .btn-add { background: var(--accent); color: #0f0f0f; border: none; border-radius: 10px; padding: 13px 22px; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500; letter-spacing: 0.02em; cursor: pointer; white-space: nowrap; align-self: stretch; transition: background 0.15s, transform 0.1s; }
    .btn-add:hover { background: var(--accent-dark); }
    .btn-add:active { transform: scale(0.97); }
    #flash { display: none; background: var(--accent); color: #0f0f0f; padding: 10px 18px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; margin-bottom: 24px; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    .section-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 16px; }
    #taskList { display: flex; flex-direction: column; gap: 2px; }
    .task-item { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 12px; background: transparent; border: 1px solid transparent; transition: background 0.15s, border-color 0.15s; animation: slideIn 0.25s ease; }
    .task-item:hover { background: var(--surface); border-color: var(--border); }
    .task-item.is-done { opacity: 0.45; }
    .task-item.is-done .task-name { text-decoration: line-through; }
    .check-btn { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color 0.2s, background 0.2s; flex-shrink: 0; }
    .check-btn:hover { border-color: var(--accent); }
    .task-item.is-done .check-btn { background: var(--accent); border-color: var(--accent); }
    .check-btn svg { display: none; }
    .task-item.is-done .check-btn svg { display: block; }
    .task-body { min-width: 0; }
    .task-name { font-size: 0.95rem; font-weight: 400; color: var(--text); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-meta { font-size: 0.78rem; color: var(--muted); font-weight: 300; }
    .task-actions { display: flex; gap: 6px; opacity: 0; transition: opacity 0.15s; }
    .task-item:hover .task-actions { opacity: 1; }
    .btn-icon { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 7px; padding: 5px 10px; font-size: 0.75rem; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
    .btn-icon:hover { color: var(--text); border-color: #555; }
    .btn-icon.del:hover { color: var(--danger); border-color: var(--danger); }
    .empty { text-align: center; padding: 80px 0; color: var(--muted); }
    .empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.3; }
    .empty p { font-size: 0.9rem; font-weight: 300; }
    .list-divider { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); padding: 20px 4px 8px; }
    @media (max-width: 600px) { nav { padding: 16px 20px; } main { padding: 40px 20px; } .add-form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">Tasks.</a>
  <div class="nav-links">
    <a href="index.html" class="active">All</a>
    <a href="admin.html">Admin</a>
  </div>
</nav>
<main>
  <div class="page-header">
    <h1>My <em>tasks</em></h1>
    <span id="taskCount">— tasks</span>
  </div>
  <div id="flash"></div>
  <div class="add-form">
    <div class="form-fields">
      <input type="text" id="newName" placeholder="What needs to be done?" />
      <textarea id="newDesc" placeholder="Add a note... (optional)" rows="2"></textarea>
    </div>
    <button class="btn-add" onclick="createTask()">Add task</button>
  </div>
  <p class="section-label">Active</p>
  <div id="taskList"></div>
</main>
<script>
  async function loadTasks() {
    const res = await fetch('/api/items');
    const items = await res.json();
    const active = items.filter(i => !i.done);
    const done = items.filter(i => i.done);
    document.getElementById('taskCount').textContent = items.length + ' task' + (items.length !== 1 ? 's' : '');
    const container = document.getElementById('taskList');
    container.innerHTML = '';
    if (items.length === 0) {
      container.innerHTML = '<div class="empty"><div class="empty-icon">○</div><p>Nothing here yet. Add your first task above.</p></div>';
      return;
    }
    renderGroup(active, container);
    if (done.length > 0) {
      const div = document.createElement('p');
      div.className = 'list-divider';
      div.textContent = 'Completed · ' + done.length;
      container.appendChild(div);
      renderGroup(done, container);
    }
  }
  function renderGroup(items, container) {
    items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'task-item' + (item.done ? ' is-done' : '');
      el.innerHTML = '<button class="check-btn" onclick="toggle(' + item.id + ', ' + item.done + ')" title="' + (item.done ? 'Undo' : 'Mark done') + '"><svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="#0f0f0f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="task-body"><div class="task-name">' + item.name + '</div><div class="task-meta">' + (item.description || formatDate(item.createdAt)) + '</div></div><div class="task-actions"><button class="btn-icon del" onclick="deleteTask(' + item.id + ')">Delete</button></div>';
      container.appendChild(el);
    });
  }
  async function createTask() {
    const name = document.getElementById('newName').value.trim();
    const description = document.getElementById('newDesc').value.trim();
    if (!name) return;
    await fetch('/api/items', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, description }) });
    document.getElementById('newName').value = '';
    document.getElementById('newDesc').value = '';
    flash('Task added');
    loadTasks();
  }
  async function toggle(id, done) {
    await fetch('/api/items/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ done: !done }) });
    loadTasks();
  }
  async function deleteTask(id) {
    await fetch('/api/items/' + id, { method: 'DELETE' });
    flash('Task deleted');
    loadTasks();
  }
  function flash(msg) {
    const el = document.getElementById('flash');
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(flash._t);
    flash._t = setTimeout(() => el.style.display = 'none', 2000);
  }
  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  document.getElementById('newName').addEventListener('keydown', e => { if (e.key === 'Enter') createTask(); });
  loadTasks();
</script>
</body>
</html>
